# Render Blueprint: provisions everything in one click.
# In Render, choose "New +" -> "Blueprint" and point it at this repo.
#
# It creates:
#   1. A managed Postgres database (shared by both services)
#   2. The Twilio backend (Flask) that answers calls and texts
#   3. The owner dashboard (Streamlit)

databases:
  - name: leadengine-db
    plan: free

services:
  # --- Twilio backend: point your Twilio webhooks here ---
  - type: web
    name: leadengine-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadengine-db
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: OWNER_CELL_PHONE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: BUSINESS_NAME
        sync: false

  # --- Owner dashboard: share this URL with the business owner ---
  - type: web
    name: leadengine-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadengine-db
          property: connectionString
      - key: BUSINESS_NAME
        sync: false
